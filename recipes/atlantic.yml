modules:
  # Stage the Marvell/Aquantia "atlantic" driver source (TP-Link TX401 / AQC107)
  # into the build. Lands at /usr/src/atlantic-2.5.16.0.tar.gz
  - type: files
    files:
      - source: atlantic-src
        destination: /usr/src

  # Build atlantic.ko against this image's kernel and install it, replacing the
  # in-tree atlantic module (which drops the TX401 link under load).
  #
  # The OGC kernel's headers are NOT in any dnf repo — they're published only in
  # the ublue akmods image — so we COPY kernel-devel from there. The floating
  # ogc-44 tag tracks the current OGC f44 kernel.
  - type: containerfile
    snippets:
      - COPY --from=ghcr.io/ublue-os/akmods:ogc-44 /kernel-rpms /tmp/akmods-kernel-rpms
      - |
        RUN --mount=type=cache,target=/var/cache/dnf \
            KERNEL_VERSION=$(rpm -q kernel --qf '%{VERSION}-%{RELEASE}.%{ARCH}') && \
            if [ ! -f /tmp/akmods-kernel-rpms/kernel-devel-${KERNEL_VERSION}.rpm ]; then \
                echo "akmods image has no kernel-devel-${KERNEL_VERSION}; pin the COPY tag to ogc-44-${KERNEL_VERSION}"; \
                ls /tmp/akmods-kernel-rpms; exit 1; \
            fi && \
            dnf install -y /tmp/akmods-kernel-rpms/kernel-devel-${KERNEL_VERSION}.rpm \
                gcc make elfutils-libelf-devel && \
            tar -xzf /usr/src/atlantic-2.5.16.0.tar.gz -C /usr/src/ && \
            make -C /usr/src/atlantic-2.5.16.0 KDIR=/usr/src/kernels/${KERNEL_VERSION} && \
            install -Dm644 /usr/src/atlantic-2.5.16.0/atlantic.ko \
                /usr/lib/modules/${KERNEL_VERSION}/extra/atlantic/atlantic.ko && \
            mkdir -p /usr/lib/depmod.d && \
            printf 'override atlantic * extra/atlantic\n' > /usr/lib/depmod.d/zz-atlantic.conf && \
            depmod -a ${KERNEL_VERSION} && \
            rm -rf /usr/src/atlantic-2.5.16.0 /usr/src/atlantic-2.5.16.0.tar.gz /tmp/akmods-kernel-rpms && \
            dnf remove -y kernel-devel gcc make elfutils-libelf-devel && \
            dnf clean all
