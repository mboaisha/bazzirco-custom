name: bluebuild
on:
  schedule:
    - cron:
        "00 06 * * *" # build at 06:00 UTC every day
        # (20 minutes after last ublue images start building)
  push:
    paths-ignore: # don't rebuild if only documentation has changed
      - "**.md"

  pull_request:
  workflow_dispatch: # allow manually triggering builds
concurrency:
  # only run one build at a time
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  bluebuild:
    name: Build Custom Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false # stop GH from cancelling all matrix builds if one fails
      matrix:
        recipe:
          # !! Add your recipes here
          - recipe.yml
    steps:
      # we check out ourselves (instead of letting the blue-build action do it)
      # so the akmods pin below survives into the build
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Pin akmods tag to base kernel
        run: |
          set -euo pipefail
          KVER=$(skopeo inspect --no-tags docker://ghcr.io/bazzirco/bazzirco-nvidia:latest \
            | jq -r '.Labels["ostree.linux"]')
          echo "Base kernel: ${KVER}"

          # Fail fast if akmods hasn't published a matching pinned tag
          skopeo inspect --no-tags \
            docker://ghcr.io/ublue-os/akmods:ogc-44-${KVER} > /dev/null

          # Rewrite the floating tag in all recipe files
          sed -i "s|akmods:ogc-44 |akmods:ogc-44-${KVER} |g" recipes/*.yml

          grep -rn "akmods:ogc-44" recipes/

      # the build is fully handled by the reusable github action
      - name: Build Custom Image
        uses: blue-build/github-action@v1.11
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          skip_checkout: true

          # enabled by default, disable if your image is small and you want faster builds
          maximize_build_space: true