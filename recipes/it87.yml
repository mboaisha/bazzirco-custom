modules:
  # Build the it87 hwmon kernel module.
  #
  # Zirconium Jackrabbit already ships kernel-devel (matched to its kernel),
  # gcc and make — dkms depends on them — so we only add git, and must NOT
  # remove the toolchain afterwards (that would rip dkms out of the base).
  # The kernel also ships an in-tree it87, so a depmod override makes ours win.
  - type: containerfile
    snippets:
      - |
        RUN --mount=type=cache,target=/var/cache/dnf \
            KERNEL_VERSION=$(rpm -q kernel --qf '%{VERSION}-%{RELEASE}.%{ARCH}') && \
            test -d /usr/src/kernels/${KERNEL_VERSION} && \
            dnf install -y git && \
            git clone https://github.com/frankcrawford/it87 /tmp/it87 && \
            cd /tmp/it87 && \
            make TARGET=${KERNEL_VERSION} && \
            install -Dm644 it87.ko /usr/lib/modules/${KERNEL_VERSION}/extra/it87.ko && \
            mkdir -p /usr/lib/depmod.d && \
            printf 'override it87 * extra\n' > /usr/lib/depmod.d/zz-it87.conf && \
            depmod -a ${KERNEL_VERSION} && \
            echo "it87" > /etc/modules-load.d/it87.conf && \
            cd / && rm -rf /tmp/it87 && \
            dnf remove -y git && \
            dnf clean all
